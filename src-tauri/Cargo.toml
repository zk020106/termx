[package]
name = "termx"
version = "0.1.0"
description = "TermX - 个人使用的跨平台 SSH 客户端"
authors = ["TermX"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "termx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 文件选择器（前端用 @tauri-apps/plugin-dialog 的 open() 挑私钥文件）
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
# 用 ring 做密码学后端：默认的 aws-lc-rs 需要 C 工具链与 NASM，在 Windows 上构建不可靠
russh = { version = "0.63", default-features = false, features = ["flate2", "ring", "rsa"] }
tokio = { version = "1", features = ["sync", "time", "io-util", "net"] }
keyring = "4"

[dev-dependencies]
# 仅测试用：给 #[tokio::test] 提供运行时
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.dev]
incremental = true
