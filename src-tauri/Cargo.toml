[package]
name = "termx"
version = "0.1.0"
description = "TermX - 个人使用的跨平台 SSH 客户端"
authors = ["TermX"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "termx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 文件选择器（前端用 @tauri-apps/plugin-dialog 的 open() 挑私钥文件）
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
# 用 ring 做密码学后端：默认的 aws-lc-rs 需要 C 工具链与 NASM，在 Windows 上构建不可靠
russh = { version = "0.63", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "3.0.1"
dirs = "6"
# process：ProxyCommand（Netcatty proxyUtils.cjs 用 child_process.spawn）
tokio = { version = "1", features = ["sync", "time", "io-util", "net", "rt", "macros", "process"] }
keyring = "4"
tauri-plugin-single-instance = "2"
encoding_rs = "0.8"
sha2 = "0.10"
base64 = "0.22"
# known_hosts 里哈希过的主机名（|1|salt|hash，HMAC-SHA1）需要自己匹配；与 russh 用的版本一致
hmac = "0.13"
sha1 = "0.11"
# 本地「解压到当前目录」的 .gz（同 Netcatty 用 zlib 内置解，不依赖系统 gzip）；russh 已经引入同版本
flate2 = "1"
# 密钥库的信封加密（AES-256-GCM）与生成密钥用的随机数；均为 russh 已引入的同版本
ring = "0.17"
rand = "0.10"
# 「上传剪贴板图片」读系统剪贴板里的图片（Electron clipboard.readImage 的等价物），编码成 PNG
arboard = { version = "3", default-features = false, features = ["image-data"] }
png = "0.18"
# 剪贴板图片文件名用本地时间（同 Netcatty）；russh-sftp 已引入
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
# 仅测试用：给 #[tokio::test] 提供运行时
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.dev]
incremental = true
