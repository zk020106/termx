[package]
name = "termx"
version = "0.1.0"
description = "TermX - 个人使用的跨平台 SSH 客户端"
authors = ["TermX"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "termx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"

[profile.dev]
incremental = true
